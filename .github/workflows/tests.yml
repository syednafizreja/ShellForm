# Run the pytest suite on every push to main and every pull request.
# ShellBench is public, so it is checked out over HTTPS (no deploy key) at the
# tag in src/shellform/pin.py. The tag is read from that file, never written
# here. Package versions match the laptop conda env "shellform".
# CalculiX comes from Ubuntu's calculix-ccx package, so the FE tests run too;
# its version may differ from the laptop's 2.23.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read ShellBench pin
        id: pin
        run: |
          tag=$(PYTHONPATH=src python -c "from shellform.pin import SHELLBENCH_TAG; print(SHELLBENCH_TAG)")
          echo "Pinned ShellBench tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out ShellBench at the pinned tag
        uses: actions/checkout@v5
        with:
          repository: syednafizreja/ShellBench
          ref: ${{ steps.pin.outputs.tag }}
          path: _shellbench
          persist-credentials: false

      - name: Install CalculiX
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx
          ccx -v || true

      - name: Install ShellBench, package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.4 scipy==1.18.1 matplotlib==3.11.2 pytest==9.1.1
          python -m pip install -e _shellbench --no-deps
          python -m pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest -v
