[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellform"
version = "0.2.0"
description = "The carbon cost of seismic resilience: gravity-only versus seismic-aware form-finding of concrete shells."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Nafiz Reja Hasib" }]
keywords = ["form-finding", "concrete shells", "seismic design", "embodied carbon", "force density method"]
# Runs in conda env "shellform", a clone of ShellBench's "research"
# (see ShellBench environment.yml), plus meshio. ShellBench itself is installed in editable mode and pinned to
# a tag; see src/shellform/pin.py. Exact versions: environment-lock.yml; long-term notes: docs/REPRODUCE.md.
dependencies = []

[project.urls]
Repository = "https://github.com/syednafizreja/ShellForm"
Documentation = "https://github.com/syednafizreja/ShellForm#readme"
Archive = "https://doi.org/10.5281/zenodo.24084110"
Explorer = "https://syednafizreja.github.io/ShellForm/explorer/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
