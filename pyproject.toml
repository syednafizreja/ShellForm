[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellform"
version = "0.2.0"
description = "The carbon cost of seismic resilience: gravity-only versus seismic-aware form-finding of concrete shells."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Nafiz Reja Hasib" }]
keywords = ["form-finding", "concrete shells", "seismic design", "embodied carbon", "force density method"]
# Exact pins of the record: requirements.txt (pip) and environment-lock.yml (conda, Windows).
# ShellBench is not on PyPI: install it from a clone at the tag in src/shellform/pin.py.
# Long-term notes: docs/REPRODUCE.md.
dependencies = [
  "numpy>=2.5",
  "scipy>=1.18",
  "matplotlib>=3.11",
  "openseespy>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=9.1"]

[project.urls]
Repository = "https://github.com/syednafizreja/ShellForm"
Documentation = "https://github.com/syednafizreja/ShellForm#readme"
Archive = "https://doi.org/10.5281/zenodo.24084110"
Explorer = "https://syednafizreja.github.io/ShellForm/explorer/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
